# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Do not insert a blank line between shell prompts.
add_newline = false
# Timeout for commands executed by starship (in milliseconds).
command_timeout = 800

format = '$shell$directory$git_branch$git_state$git_status${custom.git_staged_metrics}${custom.git_unstaged_metrics}$python$bun$time${env_var.STARSHIP_COMMAND_DURATION}$status$line_break$character'
right_format = '$gcloud$aws$azure$localip'

[shell]
disabled = false
format = '[$indicator]($style) '
style = 'white bold'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'
style = 'bold #4169e1'
repo_root_style = 'bold #4169e1'
truncation_length = 4
truncate_to_repo = true

[git_branch]
format = ' [on](white) [$symbol$branch(:$remote_branch)]($style) '
style = 'bold #32cd32'
symbol = ''                                                       # Branch symbol

[git_status]
format = '[$ahead_behind](bold cyan)[($stashed )]($style)($conflicted )'
style = "bold white"

conflicted = '⚔️[¡$count ](red)'            # Sword with file count

# Stashes Configuration
stashed = '[*$count](purple)' # Stash icon with total count

# Ahead Behind Configurations
ahead = '[↑$count](green) '                      # Up arrow with ahead count
behind = '[↓$count](orange) '                    # Down arrow with behind count
diverged = '[↑$ahead_count↓$behind_count](red) ' # Both icons with counts

[git_metrics]
disabled = true

[custom.git_staged_metrics]
command = 'bash "${STARSHIP_CONFIG%/*}/git-metrics" staged'
format = '([S\[F ](bold white)$output[\] ](bold white))'
require_repo = true
shell = ['sh']
unsafe_no_escape = true
when = true

[custom.git_unstaged_metrics]
command = 'bash "${STARSHIP_CONFIG%/*}/git-metrics" unstaged'
format = '([U\[F ](bold white)$output[\] ](bold white))'
require_repo = true
shell = ['sh']
unsafe_no_escape = true
when = true

# [kubernetes]
# disabled = false
# format = '[$symbol$context( \($namespace\))]($style) '
# style = 'bold cyan'

[python]
detect_extensions = []
detect_files = ['pyproject.toml', 'uv.lock']
detect_folders = ['.venv']
format = '[using](white) [$symbol${version}(.$virtualenv)]($style) '
python_binary = [
  [
    '.venv/bin/python',
  ],
  [
    'uv',
    'run',
    '--no-python-downloads',
    'python',
  ],
  [
    'python3',
  ],
]
style = 'bold yellow'
symbol = '🐍 '

[bun]
format = '[using](white) [$symbol$version]($style) '
style = 'bold red'

[golang]
format = '[using](white) [$symbol($version )($mod_version)]($style)'
style = 'bold cyan'

[env_var.STARSHIP_COMMAND_DURATION]
format = ' took [$env_value]($style)'
style = '#e5ff1d'

[status]
disabled = false
format = '[ status $status]($style) '
style = 'bold red'

[gcloud]
format = '([$symbol$project]($style) )'
style = 'bold blue'
symbol = '☁️ '
disabled = false

[aws]
format = '[$symbol($profile )(\($region\))]($style) '
style = 'bold yellow'

[azure]
disabled = true
format = '[$symbol($subscription)]($style) '
style = 'blue bold'

[localip]
disabled = false
format = '[int](white) [$localipv4]($style)'
ssh_only = false
style = '#edff87'

[time]
disabled = false
format = '[at](white) [$time]($style)'
style = '#58b4ff'
time_format = '%Y-%m-%d %H:%M:%S'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
